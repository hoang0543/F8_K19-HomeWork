<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Đăng nhập</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f0f2f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .login-box {
      background: #fff;
      padding: 2rem;
      border-radius: 8px;
      border: 1px solid #ddd;
      width: 100%;
      max-width: 360px;
    }

    .login-box h2 {
      text-align: center;
      margin-bottom: 1.5rem;
      font-size: 22px;
      color: #333;
    }

    .form-group {
      margin-bottom: 1rem;
    }

    .form-group label {
      display: block;
      font-size: 14px;
      color: #555;
      margin-bottom: 6px;
    }

    .form-group input {
      width: 100%;
      padding: 9px 12px;
      font-size: 14px;
      border: 1px solid #ccc;
      border-radius: 6px;
      outline: none;
    }

    .form-group input:focus {
      border-color: #4a90e2;
    }

    .extras {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      color: #555;
      margin-bottom: 1rem;
    }

    .extras a {
      color: #4a90e2;
      text-decoration: none;
    }

    .extras a:hover {
      text-decoration: underline;
    }

    .btn-login {
      width: 100%;
      padding: 10px;
      background: #4a90e2;
      color: #fff;
      font-size: 15px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    .btn-login:hover {
      background: #357abd;
    }
  </style>
</head>
<body>

  <div class="login-box">
    <h2>Đăng nhập</h2>

    <div class="form-group">
      <label for="username">Tên người dùng</label>
      <input type="text" id="username" placeholder="Nhập tên người dùng" value="emilys"/>
    </div>

    <div class="form-group">
      <label for="password">Mật khẩu</label>
      <input type="password" id="password" placeholder="Nhập mật khẩu" value="emilyspass"/>
    </div>

    <button class="btn-login">Đăng nhập</button>
  </div>

  <script type="module" src="main.js"></script>

</body>
</html>
